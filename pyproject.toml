[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cockatoo"
version = "0.1.0"
description = "Open source multipurpose neutron diffusion tool"
requires-python = ">3.11"

dependencies = [
    "numpy",
    "pyyaml",
]

[project.scripts]
cockatoo = "cockatoo.cli:main"
